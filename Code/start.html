<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompt Database</title>
  <link rel="stylesheet" href="components.css">
</head>
<body>
  <main>
    <section id="login-page" class="login-page" aria-labelledby="login-title">
      <h1 id="login-title">Prompt Database</h1>
      <form id="login-form">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <p id="login-error" class="error" role="alert"></p>
        <button type="submit">Log in</button>
      </form>
    </section>

    <section id="database-page" class="database-page" hidden>
      <header class="topbar">
        <h1>Prompt Database</h1>
        <button id="logout-button" type="button" class="secondary-button">Log out</button>
      </header>

      <div class="sheet">
        <form id="prompt-form" class="prompt-form">
          <input id="prompt-id" type="hidden">

          <label for="project-title">Project title</label>
          <input id="project-title" name="projectTitle" required>

          <label for="prompt-title">Prompt title</label>
          <input id="prompt-title" name="promptTitle" required>

          <label for="project-version">Project version</label>
          <input id="project-version" name="projectVersion" required>

          <label for="prompt-text">Prompt text</label>
          <textarea id="prompt-text" name="promptText" rows="4" required></textarea>

          <label for="response-summary">Response summary</label>
          <textarea id="response-summary" name="responseSummary" rows="3" required></textarea>

          <div class="form-actions">
            <button id="save-button" type="submit">Add prompt</button>
            <button id="cancel-edit-button" type="button" class="secondary-button" hidden>Cancel edit</button>
          </div>
        </form>

        <div class="list-header">
          <h2>Saved prompts</h2>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Project title</th>
                <th>Prompt title</th>
                <th>Project version</th>
                <th>Prompt text</th>
                <th>Response summary</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="prompt-list"></tbody>
          </table>
          <p id="empty-message" class="empty-message">No prompts saved yet.</p>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
